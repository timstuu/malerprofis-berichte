<meta charset="utf-8">
<title>Malerprofis PDF-Designer</title>
<meta name="description" content="Gestaltung der PDFs der Malerprofis-App: Wochenbericht, Auslagen, Abnahmeprotokoll.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #e9eef3;
    --panel: #ffffff;
    --panel-2: #f5f8fb;
    --ink: #15202b;
    --muted: #5b6876;
    --line: #d4dce4;
    --accent: #3981b7;
    --accent-ink: #ffffff;
    --accent-soft: #e3eef7;
    --ok: #2f8a58;
    --ok-soft: #e2f3e9;
    --warn: #9a6a0e;
    --warn-soft: #fbf0d9;
    --shadow: 0 1px 2px rgba(21, 32, 43, .08), 0 8px 24px rgba(21, 32, 43, .10);
    --sans: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1318; --panel: #161d25; --panel-2: #1c252f; --ink: #e3e9ef; --muted: #8e9bab;
      --line: #2a3541; --accent: #6aa9dc; --accent-ink: #0b1620; --accent-soft: #1b2e3f;
      --ok: #62c28d; --ok-soft: #173024; --warn: #e3b25a; --warn-soft: #33280f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1318; --panel: #161d25; --panel-2: #1c252f; --ink: #e3e9ef; --muted: #8e9bab;
    --line: #2a3541; --accent: #6aa9dc; --accent-ink: #0b1620; --accent-soft: #1b2e3f;
    --ok: #62c28d; --ok-soft: #173024; --warn: #e3b25a; --warn-soft: #33280f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  /* Kopfleiste */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .brand small { color: var(--muted); font: 12px var(--mono); }

  .docs { display: flex; gap: 2px; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; }
  .docs button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-weight: 500; color: var(--muted); white-space: nowrap;
  }
  .docs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .save { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
    white-space: nowrap;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .btn {
    border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px;
    cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Arbeitsfläche */
  .work { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; min-height: 0; }
  .controls { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding-block: 8px 40px; }
  .preview { overflow: auto; min-width: 0; padding: 24px; }

  details { border-bottom: 1px solid var(--line); }
  summary {
    list-style: none; cursor: pointer; padding: 12px 20px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "›"; margin-left: auto; color: var(--muted); transition: transform .15s; font-size: 18px; line-height: 1; }
  details[open] summary::after { transform: rotate(90deg); }
  summary .count { font: 500 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 99px; }
  .fields { display: grid; gap: 12px; padding: 2px 20px 18px; }

  .field { display: grid; gap: 5px; }
  .field-head { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .field label, .field .label { font-size: 13px; color: var(--muted); }
  .field.changed .label, .field.changed label { color: var(--ink); font-weight: 500; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .reset {
    margin-left: auto; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0 2px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .num {
    width: 76px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
    padding-right: 6px;
  }
  .num input { width: 100%; border: 0; background: transparent; padding: 4px 6px; font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .num span { font: 11px var(--mono); color: var(--muted); }
  .text, select.select {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 6px 8px;
  }
  .color { display: flex; align-items: center; gap: 8px; }
  .color input[type="color"] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--panel-2); cursor: pointer; }
  .color input[type="text"] { width: 90px; font: 12px var(--mono); }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  .accent-tool { display: grid; gap: 8px; padding: 12px; background: var(--panel-2); border-radius: 8px; }

  /* Seiten */
  .pages-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .pages-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .pages-head .hint { margin-right: auto; }
  .zoom { display: flex; gap: 2px; }
  .zoom button { border: 1px solid var(--line); background: var(--panel); padding: 4px 9px; cursor: pointer; font: 12px var(--mono); }
  .zoom button:first-child { border-radius: 6px 0 0 6px; }
  .zoom button:last-child { border-radius: 0 6px 6px 0; }
  .zoom button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .pages { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .page { margin: 0; display: grid; gap: 8px; }
  .page canvas { display: block; background: #fff; box-shadow: var(--shadow); border-radius: 2px; max-width: 100%; height: auto; }
  .page figcaption { font: 11px var(--mono); color: var(--muted); }
  .rendering .pages { opacity: .6; transition: opacity .2s; }

  .notice {
    display: grid; gap: 8px; margin-bottom: 18px; padding: 14px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); max-width: 720px;
  }
  .notice strong { font-weight: 600; }
  .notice code { font: 12px var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .notice .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .error { border-color: var(--warn); }

  @media (max-width: 820px) {
    .app { height: auto; display: block; }
    .work { display: block; }
    .controls { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .preview { padding: 16px; overflow: visible; }
    .bar { padding-inline: 16px; }
    summary { padding-inline: 16px; }
    .fields { padding-inline: 16px; }
    .docs { overflow-x: auto; max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>PDF-Designer</h1>
      <small>App __APP_VERSION__</small>
    </div>
    <div class="docs" role="group" aria-label="Dokument">
      <button type="button" id="doc-weeklyReport" data-doc="weeklyReport" aria-pressed="true">Wochenbericht</button>
      <button type="button" id="doc-expenses" data-doc="expenses" aria-pressed="false">Auslagen</button>
      <button type="button" id="doc-abnahme" data-doc="abnahme" aria-pressed="false">Abnahme</button>
    </div>
    <div class="save">
      <span id="state" class="chip">Stand aus dem Code</span>
      <button type="button" class="btn" id="reset-all" disabled>Alles zurücksetzen</button>
      <button type="button" class="btn primary" id="apply" disabled>In den Code übernehmen</button>
    </div>
  </header>

  <div class="work">
    <aside class="controls" id="controls" aria-label="Gestaltung"></aside>
    <main class="preview" id="preview">
      <div id="notice" hidden></div>
      <div class="pages-head">
        <h2 id="doc-title">Wochenbericht</h2>
        <p class="hint" id="page-count">Beispieldaten · wird gezeichnet …</p>
        <div class="zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoom-60" data-zoom="0.6" aria-pressed="false">60 %</button>
          <button type="button" id="zoom-80" data-zoom="0.8" aria-pressed="true">80 %</button>
          <button type="button" id="zoom-100" data-zoom="1" aria-pressed="false">100 %</button>
        </div>
      </div>
      <div class="pages" id="pages"></div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>/*__PDFKIT__*/</script>
<script>
(() => {
  'use strict';

  // ---------- Stand aus dem Code (beim Bauen eingesetzt) ----------
  const CODE = "__CODE_DESIGN__";
  const LOGO_URL = '__LOGO__';
  const APP_VERSION = '__APP_VERSION__';

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const get = (o, path) => path.split('.').reduce((v, k) => v?.[k], o);
  const set = (o, path, value) => {
    const keys = path.split('.');
    const last = keys.pop();
    keys.reduce((v, k) => v[k], o)[last] = value;
  };
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // ---------- Was sich einstellen lässt ----------
  // Jeder Eintrag zeigt auf einen Wert in design.json.
  const SECTIONS = [
    { title: 'Schrift und Farben', open: true, fields: [
      { path: 'font', label: 'Schriftart', type: 'select', options: [['helvetica', 'Helvetica (serifenlos)'], ['times', 'Times (Serifen)'], ['courier', 'Courier (Schreibmaschine)']] },
      { path: 'textColor', label: 'Textfarbe', type: 'color' },
      { type: 'accent' },
    ]},
    { title: 'Seitenränder', fields: [
      { path: 'page.marginLeft', label: 'Rand links', type: 'number', min: 5, max: 40, step: 1, unit: 'mm' },
      { path: 'page.marginRight', label: 'Rand rechts', type: 'number', min: 5, max: 40, step: 1, unit: 'mm' },
    ]},
    { title: 'Briefkopf', open: true, fields: [
      { path: 'letterhead.company', label: 'Firma', type: 'text' },
      { path: 'letterhead.address', label: 'Anschrift', type: 'text' },
      { path: 'letterhead.fontSize', label: 'Schriftgröße', type: 'number', min: 6, max: 16, step: 0.5, unit: 'pt' },
      { path: 'letterhead.bold', label: 'Fett', type: 'bool' },
      { path: 'letterhead.color', label: 'Farbe', type: 'color' },
      { path: 'letterhead.top', label: 'Abstand von oben', type: 'number', min: 8, max: 40, step: 0.5, unit: 'mm' },
      { path: 'letterhead.lineGap', label: 'Zeilenabstand', type: 'number', min: 3, max: 10, step: 0.5, unit: 'mm' },
      { path: 'letterhead.logoPosition', label: 'Logo', type: 'select', options: [['right', 'rechts, Anschrift links'], ['left', 'links, Anschrift rechts']] },
      { path: 'letterhead.logoWidth', label: 'Logo höchstens breit', type: 'number', min: 10, max: 90, step: 1, unit: 'mm' },
      { path: 'letterhead.logoHeight', label: 'Logo höchstens hoch', type: 'number', min: 5, max: 40, step: 1, unit: 'mm' },
      { path: 'letterhead.logoTop', label: 'Logo von oben', type: 'number', min: 3, max: 30, step: 0.5, unit: 'mm' },
      { path: 'letterhead.rule', label: 'Linie unter dem Briefkopf', type: 'bool' },
      { path: 'letterhead.ruleColor', label: 'Linienfarbe', type: 'color', when: 'letterhead.rule' },
      { path: 'letterhead.ruleWidth', label: 'Linienstärke', type: 'number', min: 0.1, max: 3, step: 0.1, unit: 'mm', when: 'letterhead.rule' },
      { path: 'letterhead.ruleTop', label: 'Linie von oben', type: 'number', min: 15, max: 60, step: 0.5, unit: 'mm', when: 'letterhead.rule' },
    ]},
    { title: 'Überschrift', fields: [
      { path: 'title.fontSize', label: 'Schriftgröße', type: 'number', min: 10, max: 32, step: 0.5, unit: 'pt' },
      { path: 'title.bold', label: 'Fett', type: 'bool' },
      { path: 'title.color', label: 'Farbe', type: 'color' },
      { path: 'title.top', label: 'Abstand von oben', type: 'number', min: 25, max: 80, step: 0.5, unit: 'mm' },
      { path: 'title.weeklyReport', label: 'Titel Wochenbericht', type: 'text' },
      { path: 'title.expenses', label: 'Titel Auslagen', type: 'text' },
      { path: 'title.abnahme', label: 'Titel Abnahme', type: 'text' },
    ]},
    { title: 'Kopfangaben', hint: 'Die Zeilen unter der Überschrift, z. B. Mitarbeiter und Woche.', fields: [
      { path: 'meta.fontSize', label: 'Schriftgröße', type: 'number', min: 7, max: 16, step: 0.5, unit: 'pt' },
      { path: 'meta.labelBold', label: 'Bezeichnungen fett', type: 'bool' },
      { path: 'meta.gapAfterTitle', label: 'Abstand zur Überschrift', type: 'number', min: 4, max: 25, step: 0.5, unit: 'mm' },
      { path: 'meta.lineHeight', label: 'Zeilenabstand', type: 'number', min: 4, max: 14, step: 0.5, unit: 'mm' },
      { path: 'meta.gapBeforeTable', label: 'Abstand zur Tabelle', type: 'number', min: 3, max: 30, step: 0.5, unit: 'mm' },
    ]},
    { title: 'Tabellen', open: true, fields: [
      { path: 'table.fontSize', label: 'Schriftgröße', type: 'number', min: 6, max: 14, step: 0.5, unit: 'pt' },
      { path: 'table.cellPadding', label: 'Innenabstand der Zellen', type: 'number', min: 0.5, max: 5, step: 0.1, unit: 'mm' },
      { path: 'table.headFill', label: 'Kopfzeile Hintergrund', type: 'color' },
      { path: 'table.headText', label: 'Kopfzeile Schrift', type: 'color' },
      { path: 'table.headBold', label: 'Kopf- und Summenzeile fett', type: 'bool' },
      { path: 'table.footFill', label: 'Summenzeile Hintergrund', type: 'color' },
      { path: 'table.footText', label: 'Summenzeile Schrift', type: 'color' },
      { path: 'table.zebra', label: 'Jede zweite Zeile einfärben', type: 'bool' },
      { path: 'table.zebraFill', label: 'Farbe dafür', type: 'color', when: 'table.zebra' },
      { path: 'table.lines', label: 'Linien', type: 'select', options: [['none', 'keine'], ['horizontal', 'nur waagerecht'], ['all', 'alle Zellen']] },
      { path: 'table.lineColor', label: 'Linienfarbe', type: 'color', when: (d) => d.table.lines !== 'none' },
      { path: 'table.lineWidth', label: 'Linienstärke', type: 'number', min: 0.05, max: 1, step: 0.05, unit: 'mm', when: (d) => d.table.lines !== 'none' },
    ]},
    { title: 'Unterschrift', fields: [
      { path: 'signature.gapAfterContent', label: 'Abstand zum Inhalt', type: 'number', min: 5, max: 50, step: 1, unit: 'mm' },
      { path: 'signature.width', label: 'Breite', type: 'number', min: 20, max: 90, step: 1, unit: 'mm' },
      { path: 'signature.height', label: 'Höhe', type: 'number', min: 8, max: 40, step: 1, unit: 'mm' },
    ]},
    { title: 'Belegseiten (Auslagen)', doc: 'expenses', fields: [
      { path: 'receiptPage.titleSize', label: 'Überschrift', type: 'number', min: 9, max: 24, step: 0.5, unit: 'pt' },
      { path: 'receiptPage.infoSize', label: 'Angaben zum Beleg', type: 'number', min: 7, max: 14, step: 0.5, unit: 'pt' },
      { path: 'receiptPage.photosPerPage', label: 'Fotos je Seite', type: 'number', min: 1, max: 4, step: 1, unit: '' },
    ]},
    { title: 'Mängelfotos (Abnahme)', doc: 'abnahme', fields: [
      { path: 'abnahme.photoWidth', label: 'Fotobreite', type: 'number', min: 30, max: 170, step: 1, unit: 'mm' },
    ]},
    { title: 'Fußzeile', fields: [
      { path: 'footer.pageNumbers', label: 'Seitenzahlen („Seite 1 von 3“)', type: 'bool' },
      { path: 'footer.text', label: 'Text links', type: 'text', placeholder: 'z. B. Amtsgericht Hamburg HRB …' },
      { path: 'footer.fontSize', label: 'Schriftgröße', type: 'number', min: 6, max: 12, step: 0.5, unit: 'pt' },
      { path: 'footer.color', label: 'Farbe', type: 'color' },
    ]},
  ];
  const FIELDS = SECTIONS.flatMap((s) => s.fields.filter((f) => f.path));
  const LABELS = Object.fromEntries(
    SECTIONS.flatMap((s) => s.fields.filter((f) => f.path).map((f) => [f.path, `${s.title}: ${f.label}`])),
  );

  // ---------- Zustand ----------
  let design = clone(CODE);
  let docKind = 'weeklyReport';
  let zoom = 0.8;
  let request = null; // Freigabe-Dokument aus der Datenbank
  let db = null;

  const changedPaths = (d) => FIELDS.map((f) => f.path).filter((p) => !same(get(d, p), get(CODE, p)));

  // ---------- Bedienfeld ----------
  const $controls = document.getElementById('controls');
  const inputs = new Map(); // path -> {wrap, update()}

  function fieldId(path, suffix = '') {
    return `f-${path.replace(/\./g, '-')}${suffix}`;
  }

  function buildField(f) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const head = document.createElement('div');
    head.className = 'field-head';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'reset';
    reset.textContent = 'zurück';
    reset.title = 'Auf den Stand im Code zurücksetzen';
    reset.addEventListener('click', () => change(f.path, clone(get(CODE, f.path))));

    let update;
    if (f.type === 'bool') {
      const lab = document.createElement('label');
      lab.className = 'switch label';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = fieldId(f.path);
      cb.addEventListener('change', () => change(f.path, cb.checked));
      lab.append(cb, document.createTextNode(f.label));
      head.append(lab, dot, reset);
      wrap.append(head);
      update = () => { cb.checked = !!get(design, f.path); };
    } else {
      const lab = document.createElement('label');
      lab.textContent = f.label;
      lab.htmlFor = fieldId(f.path);
      head.append(lab, dot, reset);
      wrap.append(head);

      if (f.type === 'number') {
        const row = document.createElement('div');
        row.className = 'row';
        const range = document.createElement('input');
        range.type = 'range';
        range.id = fieldId(f.path, '-range');
        range.setAttribute('aria-label', f.label);
        Object.assign(range, { min: f.min, max: f.max, step: f.step });
        const box = document.createElement('div');
        box.className = 'num';
        const num = document.createElement('input');
        num.type = 'number';
        num.id = fieldId(f.path);
        Object.assign(num, { min: f.min, max: f.max, step: f.step });
        const unit = document.createElement('span');
        unit.textContent = f.unit;
        box.append(num, unit);
        row.append(range, box);
        wrap.append(row);
        const commit = (v) => {
          const n = Number(v);
          if (Number.isFinite(n)) change(f.path, Math.round(n * 100) / 100);
        };
        range.addEventListener('input', () => commit(range.value));
        num.addEventListener('change', () => commit(num.value));
        update = () => {
          const v = get(design, f.path);
          range.value = v;
          if (document.activeElement !== num) num.value = v;
        };
      } else if (f.type === 'color') {
        const row = document.createElement('div');
        row.className = 'color';
        const pick = document.createElement('input');
        pick.type = 'color';
        pick.id = fieldId(f.path);
        const hex = document.createElement('input');
        hex.type = 'text';
        hex.className = 'text';
        hex.id = fieldId(f.path, '-hex');
        hex.setAttribute('aria-label', `${f.label} als Hex-Wert`);
        hex.maxLength = 7;
        row.append(pick, hex);
        wrap.append(row);
        pick.addEventListener('input', () => change(f.path, pick.value));
        hex.addEventListener('change', () => {
          const v = hex.value.trim().replace(/^#?/, '#').toLowerCase();
          if (/^#[0-9a-f]{6}$/.test(v)) change(f.path, v); else update();
        });
        update = () => {
          const v = get(design, f.path);
          pick.value = v;
          if (document.activeElement !== hex) hex.value = v;
        };
      } else if (f.type === 'select') {
        const sel = document.createElement('select');
        sel.className = 'select';
        sel.id = fieldId(f.path);
        for (const [value, text] of f.options) sel.add(new Option(text, value));
        wrap.append(sel);
        sel.addEventListener('change', () => change(f.path, sel.value));
        update = () => { sel.value = get(design, f.path); };
      } else {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'text';
        inp.id = fieldId(f.path);
        if (f.placeholder) inp.placeholder = f.placeholder;
        wrap.append(inp);
        inp.addEventListener('input', () => change(f.path, inp.value));
        update = () => { if (document.activeElement !== inp) inp.value = get(design, f.path); };
      }
    }

    const refresh = () => {
      update();
      const changed = !same(get(design, f.path), get(CODE, f.path));
      wrap.classList.toggle('changed', changed);
      dot.hidden = !changed;
      reset.hidden = !changed;
      if (f.when) {
        wrap.hidden = typeof f.when === 'function' ? !f.when(design) : !get(design, f.when);
      }
    };
    inputs.set(f.path, refresh);
    return wrap;
  }

  // Eine Farbe für Überschrift, Tabellenköpfe und Linie auf einmal.
  function buildAccentTool() {
    const box = document.createElement('div');
    box.className = 'accent-tool';
    const lab = document.createElement('label');
    lab.className = 'label';
    lab.htmlFor = 'accent-pick';
    lab.textContent = 'Hausfarbe auf alles anwenden';
    const row = document.createElement('div');
    row.className = 'color';
    const pick = document.createElement('input');
    pick.type = 'color';
    pick.id = 'accent-pick';
    pick.value = '#3981b7';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.id = 'accent-apply';
    btn.textContent = 'Anwenden';
    btn.addEventListener('click', () => {
      const c = pick.value;
      for (const p of ['title.color', 'table.headFill', 'table.footFill', 'letterhead.ruleColor']) set(design, p, c);
      changed();
    });
    row.append(pick, btn);
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Setzt Überschrift, Tabellenkopf, Summenzeile und Briefkopf-Linie. Die App nutzt #3981b7.';
    box.append(lab, row, hint);
    return box;
  }

  const sectionCounts = [];
  for (const s of SECTIONS) {
    const det = document.createElement('details');
    det.id = `sec-${SECTIONS.indexOf(s)}`;
    if (s.open) det.open = true;
    const sum = document.createElement('summary');
    const title = document.createElement('span');
    title.textContent = s.title;
    const count = document.createElement('span');
    count.className = 'count';
    sum.append(title, count);
    const fields = document.createElement('div');
    fields.className = 'fields';
    if (s.hint) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = s.hint;
      fields.append(p);
    }
    for (const f of s.fields) fields.append(f.type === 'accent' ? buildAccentTool() : buildField(f));
    det.append(sum, fields);
    $controls.append(det);
    sectionCounts.push({ s, count, det });
  }

  function refreshControls() {
    for (const refresh of inputs.values()) refresh();
    for (const { s, count, det } of sectionCounts) {
      const n = s.fields.filter((f) => f.path && !same(get(design, f.path), get(CODE, f.path))).length;
      count.textContent = n ? `${n} geändert` : '';
      count.hidden = !n;
    }
  }

  function change(path, value) {
    set(design, path, value);
    changed();
  }

  function changed() {
    refreshControls();
    refreshState();
    scheduleRender();
    scheduleDraftSave();
  }

  // ---------- Vorschau ----------
  const $pages = document.getElementById('pages');
  const $preview = document.getElementById('preview');
  const $count = document.getElementById('page-count');
  const TITLES = { weeklyReport: 'Wochenbericht', expenses: 'Auslagen-Abrechnung', abnahme: 'Abnahmeprotokoll' };

  let logo = null;
  let images = null;
  let renderTimer = 0;
  let renderSeq = 0;

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderPreview, 120);
  }

  async function renderPreview() {
    if (!images) return;
    const seq = ++renderSeq;
    $preview.classList.add('rendering');
    try {
      const bytes = PdfKit.render(docKind, clone(design), logo, images);
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
      if (seq !== renderSeq) return;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const figures = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: zoom * 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        // „print“ zeichnet ohne requestAnimationFrame — sonst steht die
        // Vorschau in einem verdeckten Fenster still.
        await page.render({ canvasContext: ctx, viewport, intent: 'print' }).promise;
        if (seq !== renderSeq) return;
        const fig = document.createElement('figure');
        fig.className = 'page';
        const cap = document.createElement('figcaption');
        cap.textContent = `Seite ${i} von ${pdf.numPages}`;
        fig.append(canvas, cap);
        figures.push(fig);
      }
      $pages.replaceChildren(...figures);
      $count.textContent = `Beispieldaten · ${pdf.numPages} ${pdf.numPages === 1 ? 'Seite' : 'Seiten'} · A4`;
      pdf.destroy();
    } catch (error) {
      console.error(error);
      if (seq === renderSeq) $count.textContent = `Vorschau fehlgeschlagen: ${error.message || error}`;
    } finally {
      if (seq === renderSeq) $preview.classList.remove('rendering');
    }
  }

  for (const btn of document.querySelectorAll('[data-doc]')) {
    btn.addEventListener('click', () => {
      docKind = btn.dataset.doc;
      for (const b of document.querySelectorAll('[data-doc]')) b.setAttribute('aria-pressed', String(b === btn));
      document.getElementById('doc-title').textContent = TITLES[docKind];
      renderPreview();
    });
  }
  for (const btn of document.querySelectorAll('[data-zoom]')) {
    btn.addEventListener('click', () => {
      zoom = Number(btn.dataset.zoom);
      for (const b of document.querySelectorAll('[data-zoom]')) b.setAttribute('aria-pressed', String(b === btn));
      renderPreview();
    });
  }

  // ---------- Beispielbilder ----------
  function loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function canvas(w, h, draw, type = 'image/jpeg') {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    return c.toDataURL(type, 0.8);
  }

  function receiptPhoto(seed, shop, total) {
    return canvas(600, 900, (g, w, h) => {
      g.fillStyle = '#6f6a62';
      g.fillRect(0, 0, w, h);
      g.save();
      g.translate(w / 2, h / 2);
      g.rotate((seed % 2 ? -1 : 1) * 0.03);
      g.fillStyle = '#fbfaf6';
      g.fillRect(-190, -400, 380, 800);
      g.fillStyle = '#2b2b2b';
      g.textAlign = 'center';
      g.font = 'bold 26px monospace';
      g.fillText(shop, 0, -340);
      g.font = '18px monospace';
      g.fillText('Hamburg · USt-IdNr. DE123456789', 0, -310);
      g.textAlign = 'left';
      const rows = [['Abdeckfolie 4x5m', '12,90'], ['Malerkrepp 38mm', '8,49'], ['Tiefgrund 5 l', '24,95'], ['Schleifgitter K120', '6,30'], ['Pinselset', '12,26']];
      rows.forEach(([a, b], i) => {
        g.fillText(a, -160, -240 + i * 34);
        g.textAlign = 'right';
        g.fillText(b, 160, -240 + i * 34);
        g.textAlign = 'left';
      });
      g.fillRect(-160, -50, 320, 2);
      g.font = 'bold 24px monospace';
      g.fillText('SUMME EUR', -160, -10);
      g.textAlign = 'right';
      g.fillText(total, 160, -10);
      g.textAlign = 'center';
      g.font = '16px monospace';
      g.fillText('BEISPIELBELEG', 0, 340);
      g.restore();
    });
  }

  function defectPhoto() {
    return canvas(800, 600, (g, w, h) => {
      const grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#d9d4c9');
      grad.addColorStop(1, '#b9b2a4');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#5a5f66';
      for (let x = 60; x < w; x += 110) g.fillRect(x, 0, 18, h);
      g.fillRect(0, 120, w, 22);
      g.fillStyle = '#44484e';
      g.beginPath();
      g.moveTo(390, 142);
      g.bezierCurveTo(392, 220, 380, 260, 386, 330);
      g.arc(386, 336, 9, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = '#d33';
      g.lineWidth = 6;
      g.beginPath();
      g.arc(388, 250, 90, 0, Math.PI * 2);
      g.stroke();
    });
  }

  function signature() {
    return canvas(500, 200, (g) => {
      g.strokeStyle = '#1b2a7a';
      g.lineWidth = 4;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(30, 140);
      g.bezierCurveTo(60, 20, 90, 180, 130, 90);
      g.bezierCurveTo(160, 30, 170, 160, 210, 110);
      g.bezierCurveTo(240, 70, 260, 150, 300, 100);
      g.bezierCurveTo(330, 60, 360, 140, 470, 80);
      g.stroke();
    }, 'image/png');
  }

  // ---------- Speichern ----------
  const $state = document.getElementById('state');
  const $apply = document.getElementById('apply');
  const $resetAll = document.getElementById('reset-all');
  const $notice = document.getElementById('notice');

  function setChip(text, kind = '') {
    $state.textContent = text;
    $state.className = `chip ${kind}`;
  }

  function refreshState() {
    const n = changedPaths(design).length;
    $resetAll.disabled = n === 0;
    const pending = request && request.status === 'offen';
    const alreadyRequested = pending && same(request.design, design);
    $apply.disabled = n === 0 || alreadyRequested;
    if (n === 0) {
      setChip(request?.status === 'übernommen' ? `Im Code · App ${request.version || APP_VERSION}` : 'Stand aus dem Code', 'ok');
    } else if (alreadyRequested) {
      setChip('Wartet auf Claude', 'accent');
    } else {
      setChip(`${n} ${n === 1 ? 'Änderung' : 'Änderungen'} · noch nicht im Code`, 'warn');
    }
  }

  let draftTimer = 0;
  function scheduleDraftSave() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 700);
  }

  async function saveDraft() {
    const draft = { design: clone(design), savedAt: new Date().toISOString(), codeVersion: APP_VERSION };
    if (db) {
      try {
        await db.doc('designer/draft').set(draft);
        return;
      } catch (error) {
        console.warn('Entwurf konnte nicht gespeichert werden:', error);
      }
    }
    try { localStorage.setItem('pdf-designer-draft', JSON.stringify(draft)); } catch {}
  }

  async function loadDraft() {
    let draft = null;
    if (db) {
      try {
        const snap = await db.doc('designer/draft').get();
        if (snap.exists) draft = snap.data();
      } catch (error) {
        console.warn('Entwurf konnte nicht geladen werden:', error);
      }
    } else {
      try { draft = JSON.parse(localStorage.getItem('pdf-designer-draft') || 'null'); } catch {}
    }
    if (!draft?.design) return;
    // Neue Felder aus dem Code bleiben erhalten, auch wenn der Entwurf älter ist.
    const merged = clone(CODE);
    for (const f of FIELDS) {
      const v = get(draft.design, f.path);
      if (v !== undefined && typeof v === typeof get(CODE, f.path)) set(merged, f.path, v);
    }
    design = merged;
  }

  function showNotice(kind, html) {
    $notice.hidden = !html;
    $notice.className = `notice ${kind || ''}`;
    $notice.innerHTML = html || '';
  }

  function changeSummary(d) {
    return changedPaths(d)
      .map((p) => `- ${LABELS[p]}: ${JSON.stringify(get(CODE, p))} → ${JSON.stringify(get(d, p))}`)
      .join('\n');
  }

  async function apply() {
    const snapshot = clone(design);
    $apply.disabled = true;
    const req = {
      design: snapshot,
      status: 'offen',
      requestedAt: new Date().toISOString(),
      baseVersion: APP_VERSION,
      changes: changedPaths(snapshot),
    };
    if (!db) {
      showFallback(snapshot, 'Die Datenbank des Designers ist in dieser Ansicht nicht erreichbar.');
      refreshState();
      return;
    }
    try {
      await db.doc('designer/request').set(req);
      request = req;
    } catch (error) {
      showFallback(snapshot, 'Die Freigabe konnte nicht gespeichert werden.');
      refreshState();
      return;
    }
    refreshState();

    const comments = await claude.use('comments');
    let can = 'off';
    try { if (comments) can = await comments.canSendToClaude(); } catch {}
    if (can === 'available') {
      try {
        const text = [
          'PDF-Design übernehmen',
          `Freigabe vom ${new Date(req.requestedAt).toLocaleString('de-DE')} (Basis App ${APP_VERSION}).`,
          'Bitte den Entwurf aus designer/request nach src/lib/pdf/design.json schreiben, prüfen, veröffentlichen und den Designer neu bauen.',
          '',
          changeSummary(snapshot),
        ].join('\n').slice(0, 3800);
        await comments.sendToClaude({ anchor: await comments.anchorFor($apply), text });
        showNotice('', '<strong>An Claude geschickt.</strong><span>Claude schreibt das Design in den Code und meldet sich in diesem Kommentar. Danach steht oben „Im Code“.</span>');
        return;
      } catch (error) {
        console.warn('Senden an Claude fehlgeschlagen:', error);
      }
    }
    showFallback(snapshot, can === 'no_session'
      ? 'Gerade ist keine Claude-Sitzung mit diesem Designer verbunden.'
      : 'Aus dieser Ansicht lässt sich Claude nicht direkt anschreiben.');
  }

  async function showFallback(snapshot, reason) {
    const downloads = await claude.use('downloads');
    showNotice('error', `
      <strong>Freigabe gespeichert, Claude noch nicht benachrichtigt.</strong>
      <span>${reason} Öffne das Projekt <code>malerprofis-berichte</code> in Claude Code und schreibe: <code>PDF-Design übernehmen</code>. Claude holt den Entwurf dann selbst aus dem Designer.</span>
      <div class="actions">
        <button type="button" class="btn" id="copy-cmd">Text kopieren</button>
        ${downloads ? '<button type="button" class="btn" id="download-json">design.json herunterladen</button>' : ''}
      </div>`);
    document.getElementById('copy-cmd').addEventListener('click', async (e) => {
      try {
        await navigator.clipboard.writeText('PDF-Design übernehmen');
        e.target.textContent = 'Kopiert';
      } catch {
        e.target.textContent = 'Kopieren nicht möglich';
      }
    });
    document.getElementById('download-json')?.addEventListener('click', async (e) => {
      try {
        await downloads.save({ filename: 'design.json', data: JSON.stringify(snapshot, null, 2) + '\n' });
        e.target.textContent = 'Gespeichert — nach src/lib/pdf/ legen';
      } catch (error) {
        if (error?.code !== 'declined') e.target.textContent = 'Herunterladen nicht möglich';
      }
    });
  }

  $apply.addEventListener('click', apply);
  $resetAll.addEventListener('click', () => {
    design = clone(CODE);
    showNotice('', '');
    changed();
  });

  // ---------- Start ----------
  async function start() {
    refreshControls();
    refreshState();
    const [logoImg] = await Promise.all([loadImage(LOGO_URL)]);
    logo = logoImg;
    images = {
      receipts: [receiptPhoto(1, 'BAUMARKT BEISPIEL', '64,90'), receiptPhoto(2, 'TANKSTELLE BEISPIEL', '78,50')],
      defect: defectPhoto(),
      signature: signature(),
    };
    if (typeof pdfjsLib === 'undefined' || typeof PdfKit === 'undefined') {
      $count.textContent = 'Vorschau nicht verfügbar: Die Bibliotheken wurden nicht geladen.';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    renderPreview();

    // Datenbank kommt später dazu; bis dahin gilt der Code-Stand.
    db = window.claude ? await claude.use('db') : null;
    await loadDraft();
    if (db) {
      db.doc('designer/request').onSnapshot((snap) => {
        request = snap.exists ? snap.data() : null;
        if (request?.status === 'übernommen' && request.version) {
          if (same(request.design, CODE)) showNotice('', '');
        }
        refreshState();
      });
    }
    refreshControls();
    refreshState();
    renderPreview();
  }

  if (!window.claude) window.claude = { use: async () => null };
  start();
})();
</script>
